version: '3.8'

services:
  app:
    build: .
    container_name: order_to_audit_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./prisma:/app/prisma

  # Optional PostgreSQL instance for environments requiring a dedicated relational server
  postgres:
    image: postgres:16-alpine
    container_name: order_to_audit_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: order_to_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
